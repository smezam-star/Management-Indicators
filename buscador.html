<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador IA — Indicadores de Gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #060d1a;
            --surface:  rgba(255,255,255,0.04);
            --border:   rgba(255,255,255,0.10);
            --primary:  #6366f1;
            --violet:   #8b5cf6;
            --cyan:     #38bdf8;
            --amber:    #f59e0b;
            --text:     #f1f5f9;
            --muted:    #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Animated background ── */
        .bg-orbs {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.25;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: #6366f1; top: -150px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: #38bdf8; bottom: -120px; right: -80px; animation-delay: -6s; }
        .orb-3 { width: 350px; height: 350px; background: #f59e0b; top: 40%; left: 50%; animation-delay: -12s; }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 30px) scale(1.1); }
        }

        /* ── Layout ── */
        .page-wrap {
            position: relative; z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
        }
        .logo {
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em;
        }
        .logo-icon {
            width: 2.4rem; height: 2.4rem; border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--violet));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(99,102,241,0.4);
        }
        .back-link {
            color: var(--muted); font-size: 0.85rem; text-decoration: none;
            display: flex; align-items: center; gap: 0.4rem;
            border: 1px solid var(--border); padding: 0.4rem 0.9rem;
            border-radius: 99px; transition: all 0.2s;
        }
        .back-link:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* ── Hero search bar ── */
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 800; letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .hero p { color: var(--muted); font-size: 1rem; margin-bottom: 1.75rem; }

        .search-bar-wrap {
            display: flex; gap: 0.5rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0.5rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .search-bar-wrap:focus-within {
            border-color: rgba(99,102,241,0.5);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 0 3px rgba(99,102,241,0.15);
        }
        #main-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text); font-size: 1.05rem;
            font-family: 'Outfit', sans-serif;
            padding: 0.6rem 0.5rem 0.6rem 1rem;
        }
        #main-input::placeholder { color: var(--muted); }
        #btn-search {
            background: linear-gradient(135deg, var(--primary), var(--violet));
            border: none; border-radius: 10px;
            color: white; font-size: 0.95rem; font-weight: 700;
            padding: 0.7rem 1.4rem; cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.25s; white-space: nowrap;
        }
        #btn-search:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
        #btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Quick engine buttons (always visible) ── */
        .engines-section { margin-bottom: 1.5rem; }
        .engines-title {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 0.6rem; text-align: center;
        }
        .engines-grid {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            justify-content: center;
        }
        .eng-btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.45rem 1rem; border-radius: 99px;
            font-size: 0.82rem; font-weight: 600;
            text-decoration: none; cursor: pointer;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text);
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }
        .eng-btn:hover {
            background: var(--eng-color);
            border-color: var(--eng-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px color-mix(in srgb, var(--eng-color) 40%, transparent);
        }

        /* ── Suggestions chips ── */
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 0.4rem;
            justify-content: center; margin-bottom: 2rem;
        }
        .sug-chip {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 99px; padding: 0.35rem 0.85rem;
            font-size: 0.8rem; cursor: pointer; color: var(--cyan);
            font-weight: 500; transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }
        .sug-chip:hover { background: var(--primary); border-color: var(--primary); color: white; }

        /* ── Results area ── */
        #results-area { flex: 1; display: flex; flex-direction: column; gap: 1rem; }

        /* Typing loader */
        .typing-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.25rem 1.5rem;
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.9rem; color: var(--muted);
        }
        .dot-loader { display: flex; gap: 5px; }
        .dot-loader span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--cyan);
            animation: bounce 1.2s ease-in-out infinite;
        }
        .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
        .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-8px); opacity: 1; } }

        /* Result cards */
        .result-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.5rem;
            animation: cardIn 0.4s ease forwards;
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

        .result-card.primary {
            border-color: rgba(99,102,241,0.3);
            background: rgba(99,102,241,0.06);
        }

        .card-top {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 1rem;
            margin-bottom: 0.75rem;
        }
        .card-title { font-size: 1.05rem; font-weight: 700; color: var(--text); }
        .src-badge {
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em;
            padding: 0.2rem 0.6rem; border-radius: 99px;
            background: color-mix(in srgb, var(--sc) 18%, transparent);
            color: var(--sc);
            border: 1px solid color-mix(in srgb, var(--sc) 30%, transparent);
            white-space: nowrap; flex-shrink: 0;
        }
        .card-extract {
            font-size: 0.92rem; line-height: 1.7; color: #cbd5e1;
            margin-bottom: 1rem;
        }
        .card-footer { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .card-link {
            display: inline-flex; align-items: center; gap: 0.35rem;
            font-size: 0.78rem; color: var(--cyan);
            text-decoration: none; background: rgba(56,189,248,0.08);
            padding: 0.3rem 0.7rem; border-radius: 99px;
            border: 1px solid rgba(56,189,248,0.2); transition: all 0.2s;
        }
        .card-link:hover { background: rgba(56,189,248,0.18); }

        /* Query history chips */
        .query-card {
            background: transparent; border: 1px solid var(--border);
            border-radius: 99px; padding: 0.3rem 0.85rem;
            font-size: 0.78rem; color: var(--muted); cursor: pointer;
            font-family: 'Outfit', sans-serif; transition: all 0.2s;
        }
        .query-card:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* Search-in results bar */
        .search-in-bar {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 1rem 1.25rem;
        }
        .search-in-title {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 0.65rem;
        }
        .search-in-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .search-in-btn {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.35rem 0.8rem; border-radius: 99px;
            font-size: 0.78rem; font-weight: 600;
            text-decoration: none;
            background: color-mix(in srgb, var(--eng-color) 12%, rgba(255,255,255,0.04));
            color: color-mix(in srgb, var(--eng-color) 85%, white);
            border: 1px solid color-mix(in srgb, var(--eng-color) 22%, transparent);
            transition: all 0.2s; white-space: nowrap;
        }
        .search-in-btn:hover {
            background: var(--eng-color); color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px color-mix(in srgb, var(--eng-color) 35%, transparent);
        }

        /* No results */
        .no-results {
            text-align: center; padding: 2.5rem 1rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px;
        }
        .no-results .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .no-results h3 { font-size: 1.1rem; margin-bottom: 0.4rem; }
        .no-results p { color: var(--muted); font-size: 0.9rem; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            #btn-search { padding: 0.7rem 1rem; }
        }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrap">

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">✨</div>
            <span>Buscador IA</span>
        </div>
        <a href="./simulador/" class="back-link">← Volver al Simulador</a>
    </div>

    <!-- Hero -->
    <div class="hero">
        <h1>Busca en múltiples fuentes a la vez</h1>
        <p>Wikipedia · DuckDuckGo · Wikidata · Open Library · Google · Bing · YouTube · Scholar</p>

        <div class="search-bar-wrap">
            <input type="text" id="main-input" placeholder="¿Qué quieres saber? Ej: indicadores de gestión pública..." autocomplete="off">
            <button id="btn-search">🔍 Buscar</button>
        </div>
    </div>

    <!-- Quick engine buttons -->
    <div class="engines-section">
        <div class="engines-title">Buscar directamente en:</div>
        <div class="engines-grid" id="top-engines">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Suggestion chips -->
    <div class="suggestions" id="suggestions-row">
        <button class="sug-chip" onclick="quickSearch('¿Qué son los indicadores de gestión pública?')">📊 Indicadores de gestión</button>
        <button class="sug-chip" onclick="quickSearch('¿Qué es el DNP en Colombia?')">🏛️ DNP Colombia</button>
        <button class="sug-chip" onclick="quickSearch('cadena de valor pública')">🔗 Cadena de valor</button>
        <button class="sug-chip" onclick="quickSearch('criterios CREMAS indicadores')">📋 Criterios CREMAS</button>
        <button class="sug-chip" onclick="quickSearch('inteligencia artificial gestión pública')">🤖 IA en gestión pública</button>
        <button class="sug-chip" onclick="quickSearch('DANE Colombia estadísticas')">📈 DANE Colombia</button>
    </div>

    <!-- Results -->
    <div id="results-area"></div>

</div>

<script>
/* ============================================================
   MULTI-SOURCE SEARCH ENGINE
   ============================================================ */

const ENGINES = [
    { name: 'Google',      icon: '🔍', color: '#4285F4', url: q => `https://www.google.com/search?q=${encodeURIComponent(q)}` },
    { name: 'Bing',        icon: '🌐', color: '#00809D', url: q => `https://www.bing.com/search?q=${encodeURIComponent(q)}` },
    { name: 'DuckDuckGo',  icon: '🦆', color: '#DE5833', url: q => `https://duckduckgo.com/?q=${encodeURIComponent(q)}` },
    { name: 'YouTube',     icon: '▶️', color: '#FF0000', url: q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}` },
    { name: 'Scholar',     icon: '🎓', color: '#5b8ef5', url: q => `https://scholar.google.com/scholar?q=${encodeURIComponent(q)}` },
    { name: 'Wikipedia',   icon: '📘', color: '#3F88C5', url: q => `https://es.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}` },
    { name: 'Open Library',icon: '📚', color: '#E87B35', url: q => `https://openlibrary.org/search?q=${encodeURIComponent(q)}` },
];

// Build top engine row
const engGrid = document.getElementById('top-engines');
ENGINES.forEach(e => {
    const a = document.createElement('a');
    a.href = '#';
    a.className = 'eng-btn';
    a.style.setProperty('--eng-color', e.color);
    a.innerHTML = `${e.icon} ${e.name}`;
    a.addEventListener('click', ev => {
        ev.preventDefault();
        const q = document.getElementById('main-input').value.trim() || 'indicadores de gestión';
        window.open(e.url(q), '_blank');
    });
    engGrid.appendChild(a);
});

/* ── Source fetchers ──────────────────────────────────────── */

async function fetchWikipediaES(q) {
    const s = await fetch(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=3&format=json&origin=*`);
    const sd = await s.json();
    if (!sd.query.search.length) return [];
    const results = [];
    for (const item of sd.query.search.slice(0, 2)) {
        const r = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(item.title)}`);
        const d = await r.json();
        if (d.extract) results.push({
            source: '📘 Wikipedia ES', color: '#3F88C5',
            title: d.title, extract: d.extract,
            url: d.content_urls?.desktop?.page || '#', label: 'Ver artículo completo'
        });
    }
    return results;
}

async function fetchWikipediaEN(q) {
    const s = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1&format=json&origin=*`);
    const sd = await s.json();
    if (!sd.query.search.length) return [];
    const title = sd.query.search[0].title;
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    const d = await r.json();
    if (!d.extract) return [];
    return [{ source: '📗 Wikipedia EN', color: '#2E8B57', title: d.title, extract: d.extract, url: d.content_urls?.desktop?.page || '#', label: 'Ver artículo (EN)' }];
}

async function fetchDDG(q) {
    const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&no_redirect=1&skip_disambig=1&origin=*`);
    const d = await r.json();
    const extract = d.AbstractText || d.Answer || '';
    if (!extract) return [];
    return [{ source: '🦆 DuckDuckGo', color: '#DE5833', title: d.Heading || q, extract, url: d.AbstractURL || `https://duckduckgo.com/?q=${encodeURIComponent(q)}`, label: 'Ver en DuckDuckGo' }];
}

async function fetchWikidata(q) {
    const r = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=es&limit=2&format=json&origin=*`);
    const d = await r.json();
    return (d.search || []).filter(i => i.description).map(i => ({
        source: '🗄️ Wikidata', color: '#f59e0b',
        title: i.label || q, extract: i.description,
        url: i.url || '#', label: 'Ver en Wikidata'
    }));
}

async function fetchOpenLibrary(q) {
    const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=2&fields=title,author_name,first_publish_year,subject`);
    const d = await r.json();
    return (d.docs || []).filter(b => b.title).slice(0, 2).map(b => {
        const authors = b.author_name?.slice(0,2).join(', ') || 'Autor desconocido';
        const subj = b.subject?.slice(0,4).join(' · ') || '';
        return {
            source: '📚 Open Library', color: '#E87B35',
            title: b.title,
            extract: `Publicado en ${b.first_publish_year || '?'} por ${authors}.${subj ? ' Temas: ' + subj + '.' : ''}`,
            url: `https://openlibrary.org/search?q=${encodeURIComponent(q)}`, label: 'Ver en Open Library'
        };
    });
}

async function fetchAllSources(q) {
    const settled = await Promise.allSettled([
        fetchWikipediaES(q).catch(() => []),
        fetchDDG(q).catch(() => []),
        fetchWikidata(q).catch(() => []),
        fetchWikipediaEN(q).catch(() => []),
        fetchOpenLibrary(q).catch(() => []),
    ]);
    return settled
        .flatMap(r => r.status === 'fulfilled' ? r.value : [])
        .filter(Boolean);
}

/* ── Render ───────────────────────────────────────────────── */

function esc(s) {
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildSearchInBar(q) {
    const btns = ENGINES.map(e =>
        `<a href="${e.url(q)}" target="_blank" rel="noopener" class="search-in-btn" style="--eng-color:${e.color}">${e.icon} ${e.name}</a>`
    ).join('');
    return `
        <div class="search-in-bar">
            <div class="search-in-title">🌐 Buscar también directamente en:</div>
            <div class="search-in-row">${btns}</div>
        </div>
    `;
}

function buildResultCard(result, isPrimary = false) {
    const sentences = result.extract.split('. ');
    const extract = sentences.slice(0, 5).join('. ') + (sentences.length > 5 ? '...' : '');
    return `
        <div class="result-card ${isPrimary ? 'primary' : ''}">
            <div class="card-top">
                <div class="card-title">${esc(result.title)}</div>
                <span class="src-badge" style="--sc:${result.color}">${result.source}</span>
            </div>
            <div class="card-extract">${esc(extract)}</div>
            <div class="card-footer">
                <a href="${result.url}" target="_blank" rel="noopener" class="card-link">🔗 ${result.label}</a>
            </div>
        </div>
    `;
}

async function doSearch(query) {
    if (!query.trim()) return;

    const area = document.getElementById('results-area');
    const btn  = document.getElementById('btn-search');
    const inp  = document.getElementById('main-input');

    inp.value = query;
    btn.disabled = true;
    btn.textContent = 'Buscando...';

    // Show typing
    area.innerHTML = `
        <div class="typing-card">
            <div class="dot-loader"><span></span><span></span><span></span></div>
            Buscando en Wikipedia, DuckDuckGo, Wikidata, Open Library...
        </div>
    `;

    try {
        const results = await fetchAllSources(query);

        area.innerHTML = '';

        if (!results.length) {
            area.innerHTML = `
                <div class="no-results">
                    <div class="icon">🔎</div>
                    <h3>Sin resultados directos</h3>
                    <p>No encontré información en las bases de datos. Prueba buscarlo en los motores de abajo.</p>
                </div>
                ${buildSearchInBar(query)}
            `;
        } else {
            // Sort by extract length — longer = more informative
            results.sort((a, b) => (b.extract?.length || 0) - (a.extract?.length || 0));

            // Primary result
            area.insertAdjacentHTML('beforeend', buildResultCard(results[0], true));

            // Other results
            results.slice(1).forEach(r => area.insertAdjacentHTML('beforeend', buildResultCard(r, false)));

            // Search-in bar at the bottom
            area.insertAdjacentHTML('beforeend', buildSearchInBar(query));
        }
    } catch (err) {
        area.innerHTML = `
            <div class="no-results">
                <div class="icon">⚠️</div>
                <h3>Error de conexión</h3>
                <p>Verifica tu conexión a internet e intenta de nuevo.</p>
            </div>
            ${buildSearchInBar(query)}
        `;
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Buscar';
    }
}

function quickSearch(q) {
    doSearch(q);
    document.getElementById('main-input').value = q;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.quickSearch = quickSearch;

// Event listeners
document.getElementById('btn-search').addEventListener('click', () => {
    doSearch(document.getElementById('main-input').value.trim());
});
document.getElementById('main-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch(document.getElementById('main-input').value.trim());
});

// Update engine buttons to use current query
document.getElementById('main-input').addEventListener('input', () => {
    // engines already get query on click from current input value
});
</script>
</body>
</html>
